version: "1"
services:
- type: web
  name: sentinel
  runtime: python
  repo: https://github.com/OmedaJared/sentinel
  plan: free
  envVars:
  - key: DATOS_DEMO
    sync: false
  - key: DATABASE_URL
    sync: false
  - key: SECRET_KEY
    sync: false
  - key: WEB_CONCURRENCY
    sync: false
  - key: PYTHON_VERSION
    sync: false
  - key: ENTORNO
    sync: false
  region: oregon
  buildCommand: pip install uv && uv sync --frozen --no-dev
  startCommand: uv run --no-dev python servidor.py
  healthCheckPath: /salud
  autoDeployTrigger: commit
