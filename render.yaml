# Despliegue en Render (https://render.com) con un clic.
#
# 1. Sube este proyecto a un repositorio de GitHub.
# 2. En Render: New → Blueprint → elige tu repositorio.
# 3. Render crea el servicio web y la base de datos solos.
#
# SECRET_KEY se genera automáticamente; no tienes que escribirla.
services:
  - type: web
    name: sentinel
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # Gunicorn con hilos: 1 proceso y varios hilos porque Socket.IO usa
    # memoria compartida en modo threading.
    startCommand: uv run --no-dev python servidor.py
    healthCheckPath: /salud
    envVars:
      - key: ENTORNO
        value: produccion
      - key: PYTHON_VERSION
        value: "3.12"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-db
          property: connectionString
      - key: DATOS_DEMO
        value: "1"

databases:
  - name: sentinel-db
    plan: free
    databaseName: sentinel
    user: sentinel
